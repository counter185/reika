
name: Create release

on:
  workflow_dispatch:
    inputs:
      versionName:
        required: true
        type: string
      preRelease:
        required: true
        type: boolean
        default: false

env:
  SOLUTION_FILE_PATH: .
  BUILD_CONFIGURATION: Release

  VERSION_NAME: ${{ github.event.inputs.versionName }}
  VERSION_REF: ${{ github.ref }}

jobs:
  build:
    runs-on: windows-latest
    permissions: write-all

    steps:
    - uses: actions/checkout@v4

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v1.0.2

    - uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    - name: Restore NuGet packages
      working-directory: ${{env.GITHUB_WORKSPACE}}
      run: nuget restore ${{env.SOLUTION_FILE_PATH}}

    - name: Generate release info file
      working-directory: ${{env.GITHUB_WORKSPACE}}
      run: ./script_gen_release_info.ps1

    - name: Build (windows)
      working-directory: ${{env.GITHUB_WORKSPACE}}
      run: msbuild /m /p:Configuration=${{env.BUILD_CONFIGURATION}} ReencGUI\reika.csproj

    - name: Build (linux)
      working-directory: ${{env.GITHUB_WORKSPACE}}\reika.Linux\
      run: dotnet publish -r linux-x64 -p:PublishSingleFile=true

    - name: Remove unnecessary files
      working-directory: ${{env.GITHUB_WORKSPACE}}
      run: |
        del ReencGUI\bin\${{env.BUILD_CONFIGURATION}}\ILMerge\*.pdb
        del ReencGUI\bin\${{env.BUILD_CONFIGURATION}}\ILMerge\*.json
        del reika.Linux\bin\${{env.BUILD_CONFIGURATION}}\net10.0\linux-x64\publish\*.pdb

    - name: Zip everything
      working-directory: ${{env.GITHUB_WORKSPACE}}
      run: |
        Compress-Archive -Path ReencGUI\bin\${{env.BUILD_CONFIGURATION}}\ILMerge\* -DestinationPath reika-windows-latest.zip -Force
        Compress-Archive -Path reika.Linux\bin\${{env.BUILD_CONFIGURATION}}\net10.0\linux-x64\publish\* -DestinationPath reika-linux-latest.zip -Force

    - name: Create Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} 
      with:
        tag_name: ${{ env.VERSION_NAME }}
        release_name: Release ${{ env.VERSION_NAME }}
        body: |
          Release generated by Actions
        draft: false
        prerelease: ${{ github.event.inputs.preRelease }}

    - name: Upload Release Asset (windows)
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./reika-windows-latest.zip
        asset_name: reika-${{env.VERSION_NAME}}-windows.zip
        asset_content_type: application/zip    

    - name: Upload Release Asset (linux)
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./reika-linux-latest.zip
        asset_name: reika-${{env.VERSION_NAME}}-linux.zip
        asset_content_type: application/zip
